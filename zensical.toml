[project]
site_name = "toolroom"
site_description = "Typed surfaces for command-line tools, generated from the tools themselves."
site_author = "Willem Kokke"
site_url = "https://willemkokke.github.io/toolroom/"
repo_url = "https://github.com/willemkokke/toolroom"
repo_name = "willemkokke/toolroom"
copyright = """
Copyright &copy; 2026 Willem Kokke — MIT licensed
"""

nav = [
  { "Home" = "index.md" },
  { "Playground" = "playground.md" },
  { "Using the tools" = "usage.md" },
  { "With footman" = "footman.md" },
  { "Typing & the stubs" = "typing.md" },
  { "Tools" = [
    { "The curated tools" = "_generated/tools/index.md" },
    # tools-nav:begin (generated by `fm tools.pages`)
    { "basedpyright" = "_generated/tools/basedpyright.md" },
    { "bash" = "_generated/tools/bash.md" },
    { "build" = "_generated/tools/build.md" },
    { "bun" = "_generated/tools/bun.md" },
    { "cmake" = "_generated/tools/cmake.md" },
    { "cmd" = "_generated/tools/cmd.md" },
    { "coverage" = "_generated/tools/coverage.md" },
    { "cspell" = "_generated/tools/cspell.md" },
    { "djlint" = "_generated/tools/djlint.md" },
    { "docker" = "_generated/tools/docker.md" },
    { "eclint" = "_generated/tools/eclint.md" },
    { "fish" = "_generated/tools/fish.md" },
    { "gh" = "_generated/tools/gh.md" },
    { "git" = "_generated/tools/git.md" },
    { "git_changelog" = "_generated/tools/git_changelog.md" },
    { "git_cliff" = "_generated/tools/git_cliff.md" },
    { "markdownlint" = "_generated/tools/markdownlint.md" },
    { "mkdocs" = "_generated/tools/mkdocs.md" },
    { "mypy" = "_generated/tools/mypy.md" },
    { "ninja" = "_generated/tools/ninja.md" },
    { "nu" = "_generated/tools/nu.md" },
    { "prek" = "_generated/tools/prek.md" },
    { "pwsh" = "_generated/tools/pwsh.md" },
    { "pytest" = "_generated/tools/pytest.md" },
    { "python" = "_generated/tools/python.md" },
    { "ruff" = "_generated/tools/ruff.md" },
    { "ruff_format" = "_generated/tools/ruff_format.md" },
    { "ssh" = "_generated/tools/ssh.md" },
    { "ssh_keygen" = "_generated/tools/ssh_keygen.md" },
    { "ssh_keyscan" = "_generated/tools/ssh_keyscan.md" },
    { "tea" = "_generated/tools/tea.md" },
    { "twine" = "_generated/tools/twine.md" },
    { "ty" = "_generated/tools/ty.md" },
    { "uv" = "_generated/tools/uv.md" },
    { "zensical" = "_generated/tools/zensical.md" },
    { "zsh" = "_generated/tools/zsh.md" },
    # tools-nav:end
  ] },
  { "Changelog" = "changelog.md" },
]

extra_css = ["assets/playground.css"]
extra_javascript = [
  { path = "assets/playground.js", type = "module", defer = true },
]

[project.theme]
language = "en"
# The wrench on the shadow board: the tool room's own glyph, same lucide
# family as the palette toggles; the favicon is the identical glyph.
icon.logo = "lucide/wrench"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Three palettes: follow the OS by default, with a manual light/dark/auto
# toggle cycle — Material's automatic-mode pattern.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
heading_level = 2
