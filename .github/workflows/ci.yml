name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fm check · py${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync
      - name: The gate
        run: uv run fm check

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build strictly
        run: uv run --group docs zensical build --clean --strict

  # The one aggregate check branch protection can require, mirroring
  # footman's single-`gate` pattern.
  gate:
    name: gate
    needs: [check, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "gate is red"; exit 1; }
          done
          echo "gate is green"
