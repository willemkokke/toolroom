name: Docs

# Builds the Zensical site strictly and publishes it to GitHub Pages
# (Pages source is "GitHub Actions", enabled via the API at repo setup).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md" # the changelog page snippets it in
      - "zensical.toml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer deploy supersedes an older one outright: the site is built
  # from main in full, so the newest run already carries everything the
  # runs behind it would have published. Cancelling rather than queueing
  # also means a run that stalls — a Pages or runner incident — cannot
  # hold the group and strand every push behind it; the next push clears
  # it. Safe because `deploy-pages` swaps the site atomically: a deploy
  # cancelled before that leaves the live one exactly as it was.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build strictly
        # The fm task, not bare zensical: it regenerates the per-tool
        # reference pages (gitignored build output) before the strict build.
        run: |
          uv sync --group docs
          uv run --group docs fm docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
