name: docker-plugin-probe

# Throwaway. `docker build` reads as buildx on Linux and macOS and as the
# pre-2019 classic builder on Windows, so the store records one provisioning
# failure as twenty per-platform differences. Asset picking, the `.exe`
# naming and the HOME/USERPROFILE overlay all look right in the code, so
# this asks the three runners directly and is deleted once it has answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync

      - name: provision docker (plugins ride along)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run fm tools.provision --only=docker --strict

      # Through the environment file, never `eval`: a Windows path is full of
      # backslashes and the shell eats them, which is how the first run of
      # this probe went looking for `C:Usersrunner...` and reported that
      # nothing had been installed anywhere.
      - name: resolve the provisioned paths
        shell: bash
        run: |
          uv run python - >> "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          from machinery import _toolfetch
          from machinery._provision import bin_dir
          from machinery._tasks import default_prefix
          b = Path(bin_dir(default_prefix()))
          h = Path(_toolfetch.home_beside(b))
          print(f"BIN_POSIX={b.as_posix()}")
          print(f"PLUGINS_POSIX={(h / '.docker' / 'cli-plugins').as_posix()}")
          print(f"HOME_NATIVE={h}")
          PY

      - name: what landed, and what docker makes of it
        shell: bash
        run: |
          echo "bin: $BIN_POSIX"
          echo "--- plugin directory ---"
          ls -la "$PLUGINS_POSIX" 2>&1 || echo "(no plugin directory)"
          docker_bin="$BIN_POSIX/docker"
          [ -f "$docker_bin" ] || docker_bin="$BIN_POSIX/docker.exe"
          echo "--- docker binary ---"
          ls -la "$docker_bin" 2>&1 || echo "(no docker binary)"
          # The reader hands the tool this home; a Windows exe reads
          # USERPROFILE, so it gets the native spelling, not the posix one.
          export HOME="$HOME_NATIVE" USERPROFILE="$HOME_NATIVE"
          echo "--- docker buildx version ---"
          "$docker_bin" buildx version 2>&1 | head -3 || echo "(buildx did not answer)"
          echo "--- docker build --help (first lines) ---"
          "$docker_bin" build --help 2>&1 | head -4 || true
          echo "--- plugins the CLI can see ---"
          "$docker_bin" --help 2>&1 | grep -E "^\s+(buildx|compose)\*?\s" || echo "(none listed)"
          # Whether the runner already decided this for us. If the split is an
          # inherited variable rather than the platform, the reader has to
          # settle it the way it settles colour, or a reading records the
          # machine that took it.
          echo "--- DOCKER_BUILDKIT in the environment ---"
          echo "value: '${DOCKER_BUILDKIT-<unset>}'"
          echo "--- forced on: does build route to buildx then? ---"
          DOCKER_BUILDKIT=1 "$docker_bin" build --help 2>&1 | head -3 || true
          echo "--- forced off: and away from it? ---"
          DOCKER_BUILDKIT=0 "$docker_bin" build --help 2>&1 | head -3 || true
